name: Validate theme ecology

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_repository.py
      - name: Test the complete DarkCold release witness
        run: |
          mkdir -p /tmp/darkcold-release-test
          tar -xzf releases/darkcold/darkcold-coonie-theme-2.2.2.tar.gz -C /tmp/darkcold-release-test
          bash /tmp/darkcold-release-test/darkcold-coonie-theme/tools/test.sh
