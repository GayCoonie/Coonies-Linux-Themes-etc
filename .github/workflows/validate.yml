name: Validate theme ecology

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install Pillow==12.3.0
      - run: sudo apt-get update && sudo apt-get install -y ripgrep libgtk-3-bin
      - run: python3 scripts/validate_repository.py
      - name: Test DarkCold directly from checkout
        run: bash themes/darkcold-coonie/tools/test.sh
      - name: Audit actual icon artwork and GTK cache
        run: python3 icons/coonie-aero-hoard/scripts/audit_theme.py icons/coonie-aero-hoard/Coonie-Aero-Hoard --report /tmp/icon-audit.md
